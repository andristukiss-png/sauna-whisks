name: Bug
description: Report a website problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page / URL
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
