name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Validate content
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/sauna-whisks-next.log 2>&1 &
          echo $! > /tmp/sauna-whisks-next.pid

      - name: Smoke production server
        run: npm run smoke:local

      - name: Show production server log on failure
        if: failure()
        run: cat /tmp/sauna-whisks-next.log || true

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/sauna-whisks-next.pid ]; then
            kill "$(cat /tmp/sauna-whisks-next.pid)" || true
          fi
