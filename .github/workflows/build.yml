name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Validate content
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

      - name: Start production server
        run: |
          VERCEL_ENV=development VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA" npm start > /tmp/sauna-whisks-next.log 2>&1 &
          echo $! > /tmp/sauna-whisks-next.pid

      - name: Verify deployment identity convergence helper
        run: |
          SAUNAWHISKS_BASE_URL="http://127.0.0.1:3000" \
          SAUNAWHISKS_EXPECTED_COMMIT="$GITHUB_SHA" \
          SAUNAWHISKS_DEPLOY_WAIT_MS="5000" \
          npm run wait:production

      - name: Smoke production server
        run: LOCAL_SMOKE_EXPECTED_COMMIT="$GITHUB_SHA" npm run smoke:local

      - name: Verify tracked files unchanged
        run: git diff --exit-code -- .

      - name: Verify no unexpected untracked files
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "Unexpected untracked files left by CI checks:"
            printf '%s\n' "$untracked"
            exit 1
          fi

      - name: Show production server log on failure
        if: failure()
        run: cat /tmp/sauna-whisks-next.log || true

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/sauna-whisks-next.pid ]; then
            kill "$(cat /tmp/sauna-whisks-next.pid)" || true
          fi
