name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'maintenance/npm-lockfile'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
          else
            git commit -m "Add generated npm lockfile"
            git push origin HEAD:maintenance/npm-lockfile
          fi

      - name: Validate content
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/sauna-whisks-next.log 2>&1 &
          echo $! > /tmp/sauna-whisks-next.pid

      - name: Smoke production server
        run: npm run smoke:local

      - name: Show production server log on failure
        if: failure()
        run: cat /tmp/sauna-whisks-next.log || true

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/sauna-whisks-next.pid ]; then
            kill "$(cat /tmp/sauna-whisks-next.pid)" || true
          fi
